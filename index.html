<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Birthday Gift 💗</title>
    <style>
        body {
            background-color: #FFEBF2; /* LIGHT_PINK */
            font-family: 'SansSerif', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            width: 700px;
            height: 500px;
            background-color: #FFEBF2;
            position: relative;
            box-sizing: border-box;
        }
        .top-deco {
            text-align: center;
            font-size: 25px;
            color: #DC648C; /* DARK_PINK */
            margin-top: 20px;
        }
        .snoopy {
            position: absolute;
            font-size: 55px;
            left: 70px;
            top: 90px;
        }
        .heart {
            position: absolute;
            font-size: 70px;
            color: #FFC0CB; /* PINK */
            right: 70px;
            top: 80px;
        }
        .question {
            text-align: center;
            font-size: 25px;
            font-weight: bold;
            color: rgb(120, 70, 90);
            line-height: 1.5;
            margin-top: 40px;
            padding: 0 100px;
        }
        .highlight {
            color: #DC648C;
        }
        .btn-container {
            text-align: center;
            margin-top: 40px;
            position: relative;
            height: 60px;
        }
        .btn {
            padding: 15px 35px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            border: none;
            outline: none;
        }
        #yesBtn {
            background-color: #DC648C;
            color: white;
            font-size: 18px;
            margin-right: 20px;
        }
        #noBtn {
            background-color: white;
            color: #DC648C;
            font-size: 16px;
            border: 1px solid #DC648C;
            position: absolute;
            transition: all 0.1s ease;
        }
        .bottom-text {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            font-family: 'Serif', Georgia, serif;
            font-style: italic;
            font-size: 16px;
            color: #DC648C;
        }
        /* Gift Screen Styling */
        .gift-title {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #DC648C;
            margin-top: 20px;
        }
        .gift-char {
            text-align: center;
            font-size: 45px;
            margin-top: 10px;
        }
        .letter-box {
            width: 500px;
            height: 220px;
            background-color: white;
            border: 3px solid #FFC0CB;
            margin: 20px auto 0 auto;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            font-size: 16px;
            color: rgb(100, 70, 80);
            white-space: pre-wrap;
            text-align: left;
            border-radius: 4px;
        }
        .ending-text {
            text-align: center;
            font-family: 'Serif', Georgia, serif;
            font-weight: bold;
            font-style: italic;
            font-size: 16px;
            color: #DC648C;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <!-- Opening Screen -->
        <div class="top-deco">🐱  ♡  🐾  ♡  🐱  ♡  🐾  ♡  🐱</div>
        <div class="snoopy">🐶</div>
        <div class="heart">♡</div>
        
        <div class="question" id="questionText">
            Are you ready to see your<br>
            <span class="highlight">VERY SPECIAL GIFT</span><br>
            from your secret manliligaw? 💌
        </div>

        <div class="btn-container">
            <button class="btn" id="yesBtn" onclick="showGift()">YES 💕</button>
            <button class="btn" id="noBtn" onmouseover="moveNoButton()" onclick="moveNoButton()">NO 🙈</button>
        </div>

        <div class="bottom-text">♡ made with a little bit of love ♡</div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const questionText = document.getElementById('questionText');
        const container = document.getElementById('mainContainer');

        // Set initial absolute position for No button inside its relative container
        noBtn.style.left = "380px";
        noBtn.style.top = "0px";

        function moveNoButton() {
            // Limits to keep it running around within a sweet spot
            const minX = 50;
            const maxX = 550;
            const minY = -100;
            const maxY = 250;

            const randomX = Math.floor(Math.random() * (maxX - minX)) + minX;
            const randomY = Math.floor(Math.random() * (maxY - minY)) + minY;

            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';

            questionText.innerHTML = `Hmm... are you sure? 🥺💕<br>Try clicking YES! 😭`;
        }

        function showGift() {
            const specialMessage = `Happy Birthday, my special someone! 💗\n\nI hope this little surprise makes you smile. I may be your secret manliligaw for now, im sorry if i wasn't the best but I just want you to know that you are someone very important and very special to me. 🥺💕\n\nI hope you enjoy your day and all the happiness even if it means with or without me and ofcourseo that comes with it. You deserve the best and i always want the best! 🎂✨\n\nFrom your secret manliligaw 💌`;

            container.innerHTML = `
                <div class="top-deco">🐱  ♡  🐾  ♡  🎀  ♡  🐾  ♡  🐱</div>
                <div class="gift-title">🎂 HAPPY BIRTHDAY! 🎂</div>
                <div class="gift-char">🐶 🐱</div>
                <div class="letter-box">${specialMessage}</div>
                <div class="ending-text">♡ From your secret manliligaw, with love ♡</div>
            `;
        }
    </script>
</body>
</html>
